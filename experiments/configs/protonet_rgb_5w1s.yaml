# ProtoNet baseline on RGB, 5-way 1-shot (meta_train) + 3-way 1-shot (val/test).
method: protonet

modalities:
  - rgb

encoder:
  name: r2plus1d_18
  pretrained: true
  # Re-compute encoder activations during backward (~70% less activation VRAM,
  # ~25-30% slower/step). Combined with optim.stream_query below this keeps
  # R(2+1)D-18 well within a ~15 GB GPU. Comment out if streaming alone fits.
  gradient_checkpointing: true

episode:
  n_way: 5
  n_way_val: 3
  n_way_test: 3
  k_shot: 1
  q_query: 15
  episodes_per_epoch: 200
  episodes_meta_val: 100
  episodes_meta_test: 1000

optim:
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0
  eval_every: 5
  fp16: true            # AMP autocast (CUDA only) — halves activation memory
  stream_query: true    # stream query in micro-batches w/ grad accumulation

data:
  manifest_path: data/processed/manifest.csv
  dataset_root: dataset
  train_classes: 6
  val_classes: 3
  test_classes: 3
  frame_count: 16
  resize_size: 128
  spatial_size: 112

seed: 42
