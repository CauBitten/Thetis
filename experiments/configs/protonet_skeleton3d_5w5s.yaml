# ProtoNet baseline on skeleton-3d visualisation video, 5-way 5-shot.
# Note: THETIS skeleton modalities are rendered visualisation videos
# (skeleton drawn on black background), NOT joint coordinates — see docs/notes.md.
method: protonet

modalities:
  - skeleton_3d

encoder:
  name: r2plus1d_18
  pretrained: true

episode:
  n_way: 5
  n_way_val: 3
  n_way_test: 3
  k_shot: 5
  q_query: 15
  episodes_per_epoch: 200
  episodes_meta_val: 100
  episodes_meta_test: 1000

optim:
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0
  eval_every: 5

data:
  manifest_path: data/processed/manifest.csv
  dataset_root: dataset
  train_classes: 6
  val_classes: 3
  test_classes: 3
  frame_count: 16
  resize_size: 128
  spatial_size: 112

seed: 42
