# ProtoNet baseline on RGB, 5-way 5-shot for meta_train; 3-way for val/test (12-class budget).
method: protonet

modalities:
  - rgb

encoder:
  name: r2plus1d_18
  pretrained: true
  # batch_size controls chunked-encoding: how many videos go through the
  # encoder per forward. Lower it if you hit CUDA OOM. Auto-picks 4 (<=6 GB),
  # 8 (<=10 GB), 16 (<=16 GB), 32 (>16 GB) when omitted.
  # batch_size: 4
  # gradient_checkpointing auto-enables on <=6 GB GPUs; force on/off here.
  # gradient_checkpointing: true

episode:
  n_way: 5
  n_way_val: 3
  n_way_test: 3
  k_shot: 5
  q_query: 15
  episodes_per_epoch: 200
  episodes_meta_val: 100
  episodes_meta_test: 1000

optim:
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0
  eval_every: 5
  fp16: true  # autocast mixed precision (CUDA only); halves activation memory

data:
  manifest_path: data/processed/manifest.csv
  dataset_root: dataset
  train_classes: 6
  val_classes: 3
  test_classes: 3
  frame_count: 16
  resize_size: 128
  spatial_size: 112

seed: 42
